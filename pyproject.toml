[project]
name = "promise-keeper"
version = "0.1.0"
description = "Promise Keeper protocol implementation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Promise Keeper"}]
keywords = ["promise", "protocol", "trust", "reputation", "evidence", "assessment"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/Promise-Foundation/promise-keeper"
Documentation = "https://github.com/Promise-Foundation/promise-keeper#readme"
Issues = "https://github.com/Promise-Foundation/promise-keeper/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
  "behave>=1.2.6",
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.8",
]
moltbook = [
  "httpx>=0.27",
  "tenacity>=8.2",
]
s3 = [
  "boto3>=1.34",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pkc"]

[tool.mypy]
python_version = "3.11"
strict = false

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkc"]
